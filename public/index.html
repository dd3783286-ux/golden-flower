<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071f1a">
  <title>三张牌</title>
  <link rel="stylesheet" href="/style.css?v=20260815-31">
</head>
<body>
  <main id="app">
    <header class="app-header">
      <div><small>纯娱乐 · 免费虚拟筹码</small><h1>三张牌</h1></div>
      <div class="user-area"><span id="network" class="network online">在线</span><button id="logout" class="icon-button hidden">切换账号</button><b id="user"></b></div>
    </header>

    <section id="login" class="screen card-panel hidden">
      <div class="hero-mark">♠</div>
        <h2>开个房，随时来一局</h2>
      <p>使用虚拟筹码娱乐，不支持充值、提现或兑换。</p>
      <a id="wxLogin" class="button primary" href="/auth/wechat">微信登录</a>
      <form id="devForm"><input id="nickname" maxlength="12" autocomplete="nickname" placeholder="输入测试昵称" required><button class="secondary">测试进入</button></form>
    </section>

    <section id="lobby" class="screen card-panel hidden">
      <div class="lobby-art"><span>♣</span><span>♥</span><span>♠</span></div>
        <h2>私人牌局</h2>
      <p>创建房间后把房号或邀请链接发给好友。</p>
      <button id="create" class="primary wide">创建房间</button>
      <div class="divider"><span>加入已有房间</span></div>
      <form id="joinForm"><input id="roomCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="输入6位房间号" required><button class="secondary">加入</button></form>
      <button id="rulesButton" class="text-button">查看完整房规</button>
    </section>

    <section id="table" class="game-screen hidden">
      <div class="room-bar">
        <div class="room-left"><button id="leave" class="icon-button">退出</button><span id="ownerName" class="owner-name">房主</span></div>
        <div class="room-title"><strong>房间 <span id="code"></span></strong><span id="roomStatus">等待开局</span></div>
        <div class="room-right"><button id="invite" class="icon-button">邀请好友</button><button id="switchName" class="room-sub-button">切换名字</button></div>
      </div>

      <div id="tableStage" class="table-stage">
        <div class="felt-rim"><div class="felt">
          <div class="table-brand">GOOD LUCK</div>
          <div class="pot-label">筹码池</div><b id="pot" class="pot-value">0</b>
          <div class="bet-info">底注 <b id="baseBet">1</b><i></i>当前档 <b id="currentBet">1</b><i></i>第 <b id="round">0</b> 局</div>
        </div></div>
        <div id="players" class="players"></div>
        <div id="chipFlight" class="chip-flight hidden">1</div>
      </div>

      <section class="my-zone">
        <div id="handState" class="hand-state">等待开局</div>
        <div id="cards" class="cards"></div>
        <div id="myStats" class="my-stats"></div>
      </section>

      <div id="waitingBar" class="waiting-bar hidden"></div>
      <div id="actions" class="action-bar"></div>

      <section class="utility-bar">
        <button id="trusteeButton">托管</button>
        <button id="chipsButton">筹码与审批 <span id="requestBadge" class="badge hidden">0</span></button>
        <button id="logButton">牌局记录</button>
        <button id="tableRulesButton">房规</button>
      </section>
    </section>
  </main>

  <div id="sheetBackdrop" class="overlay hidden"><section id="sheet" class="sheet"><div class="sheet-handle"></div><div id="sheetContent"></div><button id="closeSheet" class="text-button wide">关闭</button></section></div>

  <div id="compareOverlay" class="overlay compare-overlay hidden"><section class="compare-panel">
    <div class="versus">比牌</div>
    <div id="compareHands" class="compare-hands"></div>
    <div id="compareResult" class="compare-result"></div><button id="compareContinue" class="primary wide hidden">下一局</button>
  </section></div>

  <div id="resultOverlay" class="overlay hidden"><section class="result-panel">
    <div class="trophy">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p>
    <div id="resultRows" class="result-rows"></div><button id="closeResult" class="primary wide">知道了</button>
  </section></div>

  <div id="confirmOverlay" class="overlay hidden"><section class="confirm-panel"><h3 id="confirmTitle"></h3><p id="confirmText"></p><div><button id="confirmCancel">取消</button><button id="confirmOk" class="danger">确定</button></div></section></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=20260815-37"></script>
</body>
</html>
